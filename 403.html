<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Доступ к запрашиваемой странице запрещён"
    />
    <meta property="og:title" content="Ошибка 403 | Архив показаний" />
    <meta
      property="og:description"
      content="У вас нет прав для просмотра этой страницы"
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Ошибка 403 — Доступ запрещён | Архив показаний счетчиков</title>
    <style>
      /* Дополнительные стили специально для страниц ошибок */
      .error-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .error-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .error-card {
        max-width: 500px;
        background: white;
        border-radius: var(--radius-xl);
        padding: 3rem 2rem;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--gray-200);
      }
      .error-code {
        font-size: 6rem;
        font-weight: 700;
        color: var(--primary);
        line-height: 1;
        margin-bottom: 1rem;
      }
      .error-title {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: var(--gray-900);
      }
      .error-message {
        color: var(--gray-600);
        margin-bottom: 2rem;
      }
      .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }
    </style>
  </head>
  <body class="error-page">
    <header class="header">
      <div class="container header__container">
        <a href="/" class="logo" title="На главную">
          <img src="assets/img/logo.svg" alt="Логотип" width="40" height="40" />
          <span>Все счётчики</span>
        </a>
      </div>
    </header>

    <main class="error-content">
      <div class="container">
        <div class="error-card">
          <div class="error-code">403</div>
          <h1 class="error-title">Доступ запрещён</h1>
          <p class="error-message">
            У вас нет прав для просмотра этой страницы.<br />
            Возможно, она доступна только авторизованным пользователям.
          </p>
          <div class="error-actions">
            <a href="/" class="btn btn--primary" title="Вернуться на главную"
              >На главную</a
            >
            <a
              href="/login.html"
              class="btn btn--secondary"
              title="Войти в систему"
              >Войти</a
            >
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 Архив показаний счетчиков</p>
      </div>
    </footer>
  </body>
</html>
